<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.title">拟人搜索助手</title>
  <link rel="stylesheet" href="popup.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app" id="main">
    <header class="header enter" style="--i:0">
      <div class="brand">
        <div class="brand-icon">
          <img class="brand-img" src="icons/icon48.png" width="32" height="32" alt="">
        </div>
        <h1 data-i18n="app.title">拟人搜索助手</h1>
      </div>
      <div class="header-actions">
        <button id="lang-toggle" class="icon-btn lang-btn" type="button"
                data-i18n-aria="a11y.language" data-i18n-title="a11y.language" aria-label="切换语言" title="切换语言">
          <span id="lang-toggle-text">EN</span>
        </button>
        <button id="settings-open" class="icon-btn" type="button" aria-label="打开设置" title="设置"
                aria-haspopup="dialog" aria-controls="settings"
                data-i18n-aria="a11y.settings" data-i18n-title="a11y.settings">
          <svg class="icon-gear" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题" title="切换主题"
                data-i18n-aria="a11y.theme" data-i18n-title="a11y.theme">
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2M12 20.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="progress-section enter" style="--i:1">
        <div class="ring-wrap">
        <svg class="progress-ring" viewBox="0 0 120 120" role="progressbar" aria-label="今日任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="a11y.progress">
          <defs>
            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" class="ring-stop-a"/>
              <stop offset="100%" class="ring-stop-b"/>
            </linearGradient>
          </defs>
          <circle class="progress-track" cx="60" cy="60" r="52"/>
          <circle id="progress-arc" class="progress-fill" cx="60" cy="60" r="52"/>
        </svg>
        <div class="progress-label">
          <span id="progress-text" class="progress-count">0 / 0</span>
          <span id="progress-sub" class="progress-sub" data-i18n="progress.tasks">今日任务</span>
        </div>
        </div>
        <div id="status" class="status stopped" role="status" aria-live="polite">
          <span class="status-dot"></span>
          <span id="status-text" data-i18n="status.ready">就绪</span>
        </div>
      </div>

      <div class="points-grid" role="group" aria-label="积分概览" data-i18n-aria="a11y.points">
        <div class="point-card enter" style="--i:2" tabindex="0" aria-describedby="tip-start">
          <span class="point-label" data-i18n="points.start">可用积分</span>
          <span id="start-points" class="point-value">—</span>
          <span id="tip-start" class="tip" role="tooltip"></span>
        </div>
        <div class="point-card enter" style="--i:3" tabindex="0" aria-describedby="tip-current">
          <span class="point-label" data-i18n="points.current">今日积分</span>
          <span id="end-points" class="point-value">—</span>
          <span id="tip-current" class="tip" role="tooltip"></span>
        </div>
        <div class="point-card accent enter" style="--i:4" tabindex="0" aria-describedby="tip-earned">
          <span id="earned-label" class="point-label" data-i18n="points.earned">可领取</span>
          <span id="earned-points" class="point-value">—</span>
          <span id="tip-earned" class="tip" role="tooltip"></span>
        </div>
      </div>

      <div class="controls under-points enter" style="--i:5">
        <button id="btn-action" class="btn action" type="button" data-mode="start">
          <span class="btn-fill" aria-hidden="true"></span>
          <svg class="action-icon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path class="action-shape" d="M3.5 1.8L12.2 7L12.2 7L3.5 12.2Z"/></svg>
          <span id="btn-action-label" class="action-label" data-i18n="controls.start">自动完成任务</span>
        </button>
      </div>

      <div id="error-banner" class="error-banner" hidden>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
          <path d="M7 0a7 7 0 1 0 0 14A7 7 0 0 0 7 0zm.5 3v5h-1V3h1zm-.5 7a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5z"/>
        </svg>
        <span id="error-text"></span>
        <button id="error-dismiss" class="error-close" type="button" aria-label="关闭" data-i18n-aria="a11y.dismiss">&times;</button>
      </div>

      <!-- 今日任务列表：按扩展读取积分的同一思路从 Rewards 页面获取 -->
      <section id="today-tasks" class="today-tasks enter" style="--i:6" aria-labelledby="today-tasks-title">
        <div class="tt-head">
          <h2 id="today-tasks-title" data-i18n="todayTasks.title">今日任务</h2>
          <button id="today-tasks-refresh" class="link-btn" type="button" data-i18n="todayTasks.refresh">刷新</button>
        </div>
        <div id="today-tasks-summary" class="tt-summary"></div>
        <div class="tt-bar"><span id="today-tasks-fill" class="tt-fill"></span></div>
        <div id="today-tasks-groups" class="tt-groups"></div>
        <p id="today-tasks-empty" class="tt-empty" data-i18n="todayTasks.loading">正在读取今日任务…</p>
        <p id="today-tasks-note" class="tt-note" data-i18n="todayTasks.onlyPoints">仅显示带积分的任务</p>
        <p id="today-tasks-msg" class="preview-msg" role="status" hidden></p>
      </section>

    </main>
  </div>

  <section id="settings" class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" inert>
    <header class="settings-head">
      <button id="settings-back" class="icon-btn" type="button" aria-label="返回" title="返回"
              data-i18n-aria="a11y.back" data-i18n-title="a11y.back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="settings-title" data-i18n="settings.title">设置</h2>
    </header>

    <div class="settings-body">
      <div class="set-group" style="--g:0">
        <h3 class="set-title" data-i18n="settings.appearance">外观</h3>
        <div class="set-row">
          <span class="set-label" data-i18n="settings.language">语言 / Language</span>
          <div class="segmented" id="set-lang" role="radiogroup" aria-label="Language">
            <button type="button" role="radio" data-value="zh">中文</button>
            <button type="button" role="radio" data-value="en">English</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label" data-i18n="settings.theme">主题</span>
          <div class="segmented" id="set-theme" role="radiogroup" aria-label="Theme">
            <button type="button" role="radio" data-value="light" data-i18n="theme.light">浅色</button>
            <button type="button" role="radio" data-value="dark" data-i18n="theme.dark">深色</button>
            <button type="button" role="radio" data-value="system" data-i18n="theme.system">跟随系统</button>
          </div>
        </div>
        <label class="set-row">
          <span class="set-label"><span data-i18n="settings.reduce">减少动画</span><small data-i18n="settings.reduceHint">关闭动效</small></span>
          <input type="checkbox" id="set-reduce" class="switch">
        </label>
      </div>

      <div class="set-group" style="--g:1">
        <h3 class="set-title" data-i18n="settings.searches">搜索</h3>
        <div class="set-row column">
          <span class="set-label"><span data-i18n="settings.defaultCount">默认搜索次数</span><small data-i18n="auto.countHint">自动完成任务的上限</small></span>
          <div class="chips" id="set-count-chips" role="radiogroup" aria-label="Default searches">
            <button type="button" role="radio" data-value="10">10</button>
            <button type="button" role="radio" data-value="20">20</button>
            <button type="button" role="radio" data-value="30">30</button>
            <button type="button" role="radio" data-value="50">50</button>
            <input type="number" id="set-count" min="1" max="150" step="1" aria-label="自定义搜索次数" data-i18n-aria="a11y.customCount" data-i18n-ph="settings.other" placeholder="其他">
          </div>
        </div>
        <div class="set-row">
          <span class="set-label"><span data-i18n="settings.pace">节奏</span><small data-i18n="settings.paceHint">每次结果停留时长</small></span>
          <div class="segmented" id="set-pace" role="radiogroup" aria-label="Pace">
            <button type="button" role="radio" data-value="normal" data-i18n="pace.normal">标准</button>
            <button type="button" role="radio" data-value="relaxed" data-i18n="pace.relaxed">舒缓</button>
          </div>
        </div>
        <label class="set-row">
          <span class="set-label"><span data-i18n="settings.autostop">到达每日上限即停止</span><small data-i18n="settings.autostopHint">Bing 搜索计满后提前结束</small></span>
          <input type="checkbox" id="set-autostop" class="switch">
        </label>
      </div>

      <div class="set-group" style="--g:2">
        <h3 class="set-title" data-i18n="settings.automation">自动化</h3>
        <label class="set-row">
          <span class="set-label"><span data-i18n="settings.cooldown">等待 Bing 冷却</span><small data-i18n="settings.cooldownHint">积分暂停时等待后继续</small></span>
          <input type="checkbox" id="set-cooldown" class="switch">
        </label>
        <div id="cooldown-opts" class="sub-opts">
          <div class="set-row">
            <span class="set-label" data-i18n="settings.cooldownWait">等待时长</span>
            <div class="segmented" id="set-cooldown-min" role="radiogroup" aria-label="Cooldown wait">
              <button type="button" role="radio" data-value="10">10m</button>
              <button type="button" role="radio" data-value="15">15m</button>
              <button type="button" role="radio" data-value="20">20m</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 原 Daily reminders → 自动完成任务设置 -->
      <div class="set-group" id="auto-group" style="--g:3">
        <h3 class="set-title" data-i18n="auto.title">自动完成任务</h3>
        <label class="set-row">
          <span class="set-label"><span data-i18n="auto.enable">定时自动运行</span><small data-i18n="auto.enableHint">到点自动点击未完成任务卡片，并按剩余分数搜索</small></span>
          <input type="checkbox" id="set-auto" class="switch">
        </label>
        <div id="auto-opts" class="auto-opts">
          <div class="set-row column">
            <span class="set-label"><span data-i18n="auto.count">搜索次数上限</span><small data-i18n="auto.countHint">按今日 Bing 搜索剩余分数自动决定，不超过此值</small></span>
            <div class="chips" id="set-auto-count-chips" role="radiogroup" aria-label="Auto task searches">
              <button type="button" role="radio" data-value="10">10</button>
              <button type="button" role="radio" data-value="20">20</button>
              <button type="button" role="radio" data-value="30">30</button>
              <button type="button" role="radio" data-value="50">50</button>
              <input type="number" id="set-auto-count" min="1" max="150" step="1" aria-label="自定义搜索次数" data-i18n-aria="a11y.customCount" data-i18n-ph="settings.other" placeholder="其他">
            </div>
          </div>
          <div class="set-row column">
            <span class="set-label"><span data-i18n="auto.times">启动时间</span><small data-i18n="auto.timesHint">可添加多个，自动去重排序</small></span>
            <div class="time-add">
              <input type="time" id="set-auto-time" aria-label="启动时间" data-i18n-aria="a11y.autoTime">
              <button id="set-auto-time-add" class="small-btn" type="button" data-i18n="auto.addTime">添加</button>
            </div>
            <div id="set-auto-times" class="time-chips"></div>
          </div>
          <div class="set-row">
            <span class="set-label"><span data-i18n="auto.level">拟人强度</span><small data-i18n="auto.levelHint">影响鼠标轨迹、滚动与每轮时长</small></span>
            <div class="segmented" id="set-auto-level" role="radiogroup" aria-label="Human level">
              <button type="button" role="radio" data-value="1" data-i18n="level.low">低</button>
              <button type="button" role="radio" data-value="2" data-i18n="level.mid">中</button>
              <button type="button" role="radio" data-value="3" data-i18n="level.high">高</button>
            </div>
          </div>
        </div>
        <p id="set-auto-msg" class="preview-msg" role="status" hidden></p>
      </div>

      <div class="set-group" id="test-group" style="--g:4">
        <h3 class="set-title" data-i18n="test.title">测试拟人搜索</h3>
        <div class="set-row column">
          <span class="set-label"><span data-i18n="test.run">单次拟人搜索测试</span><small data-i18n="test.runHint">在后台标签页跑一次真实键鼠搜索，不读积分、不影响自动任务</small></span>
          <div class="test-actions">
            <button id="set-test-run" class="small-btn primary" type="button" data-i18n="test.runButton">运行测试</button>
            <span id="set-test-status" class="test-status"></span>
          </div>
          <div id="set-test-result" class="test-result" hidden></div>
        </div>
      </div>

      <button id="set-reset" class="reset-btn" type="button" style="--g:5" data-i18n="settings.reset">恢复默认设置</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
