<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拟人搜索助手</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="app" id="app" data-state="idle">

    <header class="topbar">
      <div class="brand"><span class="logo">✦</span><span class="name">拟人搜索</span></div>
      <span class="state-chip" id="stateChip"><i class="pulse"></i><span id="stateText">空闲</span></span>
    </header>

    <main>
      <section class="hero">
        <div class="hero-label">本轮进度</div>
        <div class="hero-value"><span id="done">0</span><span class="slash">/</span><span id="total">12</span></div>
        <div class="bar-track"><div class="bar-fill" id="heroFill"></div></div>
        <div class="hero-sub" id="heroSub">设置搜索次数后点「开始搜索」</div>
      </section>

      <section class="config">
        <div class="config-info">
          <div class="config-title">搜索次数</div>
          <div class="config-desc">1 ~ 60 轮，每轮一条随机热搜词</div>
        </div>
        <div class="stepper">
          <button type="button" id="btnMinus" aria-label="减少">−</button>
          <input id="repeat" type="number" min="1" max="60" step="1" value="12" aria-label="搜索次数">
          <button type="button" id="btnPlus" aria-label="增加">+</button>
        </div>
      </section>

      <section class="schedule">
        <div class="schedule-head">
          <div>
            <div class="config-title">定时启动</div>
            <div class="config-desc">每天到点自动开始，最多 10 个</div>
          </div>
          <label class="switch" title="开启/关闭定时启动">
            <input type="checkbox" id="autoEnabled" aria-label="开启定时启动">
            <span class="switch-track"><span class="switch-knob"></span></span>
          </label>
        </div>
        <div class="times" id="timeList" hidden></div>
        <div class="time-add">
          <input type="time" id="timeInput" value="09:00" aria-label="启动时间" step="60">
          <button type="button" class="btn-add" id="btnAddTime">添加</button>
        </div>
        <div class="schedule-tip" id="scheduleTip">关闭中，可先添加时间点</div>
      </section>

      <section class="actions">
        <button class="btn btn-primary" id="btnStart"><span class="ic">▶</span> 开始搜索</button>
        <button class="btn btn-stop" id="btnStop" hidden>■ 立即停止</button>
      </section>

      <div class="feedback" id="feedback" hidden></div>

      <section class="logs">
        <div class="logs-head">
          <span>运行日志</span>
          <button class="link" id="btnClearLogs" type="button">清空</button>
        </div>
        <div class="log-list" id="logList"></div>
      </section>
    </main>
  </div>
  <script type="module" src="./popup.js"></script>
</body>
</html>
