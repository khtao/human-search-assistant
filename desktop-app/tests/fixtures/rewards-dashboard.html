<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Microsoft Rewards</title>
</head>
<body>
<!--
  端到端测试夹具：严格仿照用户截图里「已登录」的 rewards.bing.com 首页。
  v1.1.4 关键差异（故意把旧版能命中的线索全部去掉，证明「直读可见面板」必要）：
   1) 没有任何 text-labelControl / text-pageHeader class；
   2) 没有 availablePoints / pointsEarnedToday / claimablePoints JSON 字段；
   3) 积分只以纯中文 DOM 文本呈现：「可用积分 20,192」「可领取 0」；
   4) <script> bundle 里含 "Sign in to your Microsoft account" + "创建帐户"
      + "忘记用户名"，旧版对 outerHTML 跑 isSignInPage 会把已登录页判成 'out'；
   5) 标签与数字分处不同容器，中间隔着其它文字，旧版 readCard 的
      「向上 4 层找同卡片数字」也拿不到，只有整页可见文本的 nearText 能命中。
-->
<header class="site-header">
  <span class="ms-logo">Microsoft</span><span>| Rewards</span>
  <nav>
    <a href="https://rewards.bing.com/dashboard">首页</a>
    <a href="https://rewards.bing.com/earn">积分赚取</a>
    <a href="https://rewards.bing.com/redeem">兑换</a>
    <a href="https://rewards.bing.com/about">关于</a>
    <a href="https://rewards.bing.com/referandearn">邀请好友赚积分</a>
  </nav>
  <div class="user-area">
    <span class="points-top">20,192</span>
    <span class="medal"></span>
    <span class="avatar"></span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="medal-big"></div>
    <h1>红涛 康</h1>
    <span class="tier">金牌会员</span>
    <a href="https://rewards.bing.com/about">了解详细信息 &gt;</a>
  </section>

  <section class="point-cards">
    <div class="point-card">
      <span class="label">可用积分</span>
      <div class="amount">20,192</div>
      <a href="https://rewards.bing.com/redeem">兑换 &gt;</a>
    </div>
    <div class="point-card">
      <span class="label">今日积分</span>
      <div class="amount">257</div>
    </div>
    <div class="point-card">
      <span class="label">可领取</span>
      <div class="amount">0</div>
      <a href="https://rewards.bing.com/dashboard">领取 &gt;</a>
    </div>
  </section>

  <h2>福利</h2>
  <div class="banner">本周精选福利与会员专属活动</div>

  <h2>每日活动</h2>
  <section class="daily">
    <a class="task-card" href="https://rewards.bing.com/earn/star">
      <h3>必应 Star 奖励</h3>
      <p>完成搜索获取额外积分</p>
      <span class="pts">+50</span>
    </a>
    <a class="task-card" href="https://rewards.bing.com/earn/monthly">
      <h3>每月升级奖励</h3>
      <p>上月已赚取 420/420</p>
      <span class="pts">+420</span>
    </a>
  </section>

  <h2>日常任务</h2>
  <section class="promo">
    <a class="task-card" href="https://rewards.bing.com/earn/defaultsearch">
      <h3>默认搜索奖励</h3>
      <p>上月已赚取 210/210</p>
      <span class="pts">+210</span>
    </a>
    <a class="task-card" href="https://rewards.bing.com/earn/wallpaper-free">
      <h3>免费专属壁纸</h3>
      <p>本周全新上线，Rewards 会员可免费获取</p>
      <span class="pts">+10</span>
    </a>
  </section>
</main>

<!-- 干扰：真实官网的 JS bundle 里普遍存在这些字符串，但不在可见文本中 -->
<script>
window.__NEXT_DATA__ = {
  strings: {
    signIn: "Sign in to your Microsoft account",
    createAccount: "创建帐户",
    about: "About – Microsoft Rewards",
    forgot: "忘记用户名",
    signInCta: "Sign in to Microsoft"
  },
  footer: "Gift cards for the win"
};
</script>
</body>
</html>
