appId: com.local.humansearchassistant
productName: 拟人搜索助手
copyright: Local personal tool · 非 Microsoft 官方产品

# Windows 专用配置。与 Linux 配置分离，避免跨平台配置互相触发 schema 校验。
# Build from the locally installed electron@45.2.3 runtime.
# Prevents a second Electron download (which can fail with ECONNRESET).
# Run `npm run doctor` first and ensure node_modules/electron/dist/electron.exe exists.
electronDist: node_modules/electron/dist

directories:
  buildResources: build
  output: dist

files:
  - main.js
  - preload.js
  - host.html
  - lib/core.js
  - lib/debug-capture.js
  - src/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
  - '!src/**/*.md'
  - '!**/*.md'
  - '!**/.DS_Store'
  - '!lib/electron-lite.js'
  - '!scripts/**'
  - '!tests/**'
  - '!docs/**'
  - '!README*'
  - '!package-lock.json'

# Keep real disk copies of tray icons outside app.asar (Windows notification area).
extraResources:
  - from: build/icon.ico
    to: tray-icons/icon.ico
  - from: build/icon.png
    to: tray-icons/icon.png

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: HumanSearchAssistant-Windows-${version}-${arch}.${ext}
  signtoolOptions:
    signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 拟人搜索助手
  deleteAppDataOnUninstall: false

portable:
  artifactName: HumanSearchAssistant-Windows-Portable-${version}.${ext}

compression: maximum
asar: true
